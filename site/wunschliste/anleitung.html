<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Wunschliste: Anleitung fürs Handy</title>
<meta name="description" content="Schritt für Schritt erklärt: die Wunschliste auf dem Android-Handy oder iPhone einrichten, anmelden, Wünsche reservieren und Geschenke besorgen.">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<!-- Eigenstaendige Anleitung: CSS und JS stehen hier drin, alle Links zeigen auf die Live-Seite.
     So funktioniert die Datei auch, wenn man sie einzeln per Mail oder Messenger weitergibt. -->
<style>
:root {
  --bg: #fbfaf7; --fg: #141414; --mut: #3b3b3b; --line: #8d8a84; --panel: #ffffff;
  --pri: #0b4fc4; --pri-fg: #ffffff; --pri-hover: #083d99;
  --sec-bg: #ffffff; --sec-fg: #0b2f75;
  --hint-bg: #fff3d1; --hint-line: #a65f00;
  --hl: #e03a00; --hl-soft: rgba(224, 58, 0, .28);
  --focus: #6a00d6;
  /* Farben der gezeichneten Handy-Bildschirme */
  --frame: #24262c; --s-bg: #f2f3f7; --s-fg: #15171c; --s-mut: #575c68; --s-card: #ffffff; --s-line: #d3d6de;
  --s-acc: #5847e0; --s-acc-fg: #ffffff; --s-dim: rgba(10, 12, 20, .45); --s-sys: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121316; --fg: #f3f3f3; --mut: #cfcfcf; --line: #7b7f88; --panel: #1c1e23;
    --pri: #a8c8ff; --pri-fg: #0a1630; --pri-hover: #cfe0ff;
    --sec-bg: #1c1e23; --sec-fg: #cfe0ff;
    --hint-bg: #2c2410; --hint-line: #ffb020;
    --hl: #ffb020; --hl-soft: rgba(255, 176, 32, .3);
    --focus: #ffd84d;
    --frame: #4a4e58; --s-bg: #0f1320; --s-fg: #eef0f6; --s-mut: #a9afc1; --s-card: #1c2234; --s-line: #343c54;
    --s-acc: #9286ff; --s-acc-fg: #0b0d18; --s-dim: rgba(0, 0, 0, .6); --s-sys: #262b3a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { font-size: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html.big { font-size: 118%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 1.3125rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-wrap: break-word; padding-bottom: calc(118px + env(safe-area-inset-bottom));
}
a { color: var(--sec-fg); text-underline-offset: 3px; text-decoration-thickness: 2px; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
h1, h2 { line-height: 1.2; margin: 0; }
h1 { font-size: 1.85rem; }
h1:focus { outline: none; }
h2 { font-size: 1.45rem; }
p { margin: 0; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; }

/* Kopf mit Fortschritt */
.top { border-bottom: 2px solid var(--line); background: var(--panel); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.25rem; text-align: left; color: var(--fg); text-decoration: none; background: none; border: 0; padding: 6px 0; font-family: inherit; cursor: pointer; }
.brand-ic { width: 34px; height: 34px; border-radius: 10px; background: var(--s-acc); display: grid; place-items: center; font-size: 20px; flex: none; }
.size-btn { font: inherit; font-size: 1.25rem; font-weight: 600; min-height: 48px; padding: 6px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--sec-bg); color: var(--fg); cursor: pointer; white-space: nowrap; }
html.big .size-btn { border-color: var(--pri); box-shadow: inset 0 0 0 2px var(--pri); }
.prog { padding-bottom: 12px; }
.prog p { font-weight: 700; font-size: 1.25rem; margin-bottom: 6px; }
.bar { height: 12px; border-radius: 99px; background: color-mix(in srgb, var(--line) 35%, transparent); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pri); border-radius: 99px; transition: width .3s ease; }

/* Ein Schritt: Text und Bild */
main { padding-top: 22px; }
main:focus { outline: none; }
.step { display: grid; gap: 22px; }
.txt { display: grid; gap: 16px; align-content: start; }
.txt b, .txt strong { font-weight: 700; }
.q { font-weight: 700; padding: 0 .15em; border-radius: 4px; background: color-mix(in srgb, var(--hl) 16%, transparent); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.lead { color: var(--fg); }
ol.do, ul.do { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; }
ul.keys { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ul.keys li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; }
ul.keys .k { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); display: grid; place-items: center; background: var(--panel); }
ul.keys svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.hint { background: var(--hint-bg); border-left: 6px solid var(--hint-line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
.hint p { font-size: 1.25rem; }
.acts { display: flex; flex-wrap: wrap; gap: 12px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-align: center;
  font: inherit; font-weight: 700; font-size: 1.3rem; min-height: 64px; padding: 12px 24px; border-radius: 16px;
  border: 3px solid var(--pri); background: var(--pri); color: var(--pri-fg); text-decoration: none; cursor: pointer;
}
.btn:hover { background: var(--pri-hover); border-color: var(--pri-hover); }
.btn.ghost { background: var(--sec-bg); color: var(--sec-fg); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--sec-fg); background: var(--sec-bg); }
.btn.wide { width: 100%; }
.btn[hidden] { display: none; }
.skip-link { font-size: inherit; }

/* Auswahl am Anfang */
.choice { display: grid; gap: 14px; }
.pick {
  display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center; text-align: left; width: 100%;
  font: inherit; color: var(--fg); background: var(--panel); border: 3px solid var(--line); border-radius: 18px;
  padding: 18px; cursor: pointer; min-height: 96px;
}
.pick:hover { border-color: var(--pri); }
.pick .pi { font-size: 44px; line-height: 1; text-align: center; }
.pick b { display: block; font-size: 1.4rem; }
.pick small { display: block; font-size: 1.25rem; color: var(--mut); }
.pick .you { display: inline-block; margin-top: 6px; font-size: 1.25rem; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--pri); color: var(--pri-fg); }
.pick.mine { border-color: var(--pri); }
.desk-note[hidden] { display: none; }
.url { font-weight: 700; word-break: break-all; }

/* Fusszeile mit Zurueck/Weiter */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--panel); border-top: 2px solid var(--line);
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
}
.nav .wrap { display: grid; grid-template-columns: 1fr 1.6fr; gap: 12px; }
.nav .btn { width: 100%; padding: 10px 12px; }
.nav.solo .wrap { grid-template-columns: 1fr; }
.nav[hidden] { display: none; }

/* ---------- Gezeichnetes Handy ---------- */
.fig { margin: 0; display: grid; justify-items: center; gap: 10px; }
.fig figcaption { font-size: 1.25rem; color: var(--mut); text-align: center; max-width: 300px; }
.phone {
  width: 236px; max-width: 100%; height: 456px; border-radius: 36px; padding: 10px; background: var(--frame);
  box-shadow: 0 20px 40px -24px rgba(0, 0, 0, .55);
}
.scr {
  position: relative; height: 100%; border-radius: 27px; overflow: hidden; background: var(--s-bg); color: var(--s-fg);
  font: 400 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; display: flex; flex-direction: column;
}
.scr * { box-sizing: border-box; }
.m-st { display: flex; justify-content: space-between; align-items: center; padding: 7px 18px 4px; font-size: 11px; font-weight: 700; flex: none; }
.m-st i { display: inline-block; width: 18px; height: 9px; border: 1.5px solid currentColor; border-radius: 3px; position: relative; }
.m-st i::after { content: ""; position: absolute; inset: 1px 4px 1px 1px; background: currentColor; border-radius: 1px; }
.m-url { margin: 4px 10px 6px; padding: 6px 10px; border-radius: 99px; background: var(--s-card); border: 1px solid var(--s-line); font-size: 11px; color: var(--s-mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
.m-nav { display: flex; align-items: center; gap: 7px; padding: 6px 12px 8px; font-weight: 700; flex: none; border-bottom: 1px solid var(--s-line); }
.m-logo { width: 18px; height: 18px; border-radius: 6px; background: var(--s-acc); }
.m-nav .m-burger { margin-left: auto; width: 16px; height: 10px; border-top: 2px solid currentColor; border-bottom: 2px solid currentColor; position: relative; }
.m-nav .m-burger::after { content: ""; position: absolute; left: 0; right: 0; top: 2px; border-top: 2px solid currentColor; }
.m-body { flex: 1; padding: 10px 12px; display: grid; gap: 9px; align-content: start; overflow: hidden; position: relative; }
.m-eye { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--s-mut); font-weight: 700; }
.m-h { font-size: 17px; font-weight: 800; line-height: 1.2; }
.m-h.s { font-size: 14px; }
.m-p { font-size: 11.5px; color: var(--s-mut); }
.m-card { background: var(--s-card); border: 1px solid var(--s-line); border-radius: 12px; padding: 9px; display: grid; gap: 7px; }
.m-btn { display: block; text-align: center; padding: 8px 10px; border-radius: 10px; background: var(--s-acc); color: var(--s-acc-fg); font-weight: 700; font-size: 12.5px; }
.m-btn.ghost { background: transparent; color: var(--s-fg); border: 1.5px solid var(--s-line); }
.m-btn.sm { display: inline-block; padding: 5px 9px; font-size: 11.5px; }
.m-row { display: flex; gap: 8px; align-items: center; }
.m-row.end { justify-content: flex-end; }
.m-row.split { justify-content: space-between; }
.m-tbtn { font-weight: 700; color: var(--s-acc); padding: 6px 8px; border-radius: 8px; font-size: 12.5px; }
.m-dim { position: absolute; inset: 0; background: var(--s-dim); z-index: 2; }
.m-dlg { position: absolute; left: 12px; right: 12px; top: 34%; z-index: 3; background: var(--s-sys); border-radius: 18px; padding: 14px; display: grid; gap: 8px; box-shadow: 0 12px 30px rgba(0, 0, 0, .35); }
.m-dlg b { font-size: 14px; }
.m-dlg p { font-size: 12px; color: var(--s-mut); }
.m-dlg .m-center { text-align: center; justify-items: center; display: grid; gap: 6px; }
.m-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--s-sys); border-radius: 18px 18px 0 0; padding: 14px 14px 22px; display: grid; gap: 8px; box-shadow: 0 -10px 30px rgba(0, 0, 0, .25); }
.m-sheet b { font-size: 14px; }
.m-snack { position: absolute; left: 10px; right: 10px; bottom: 16px; z-index: 3; background: #2a2d36; color: #fff; border-radius: 10px; padding: 10px 10px 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11.5px; }
.m-snack .m-tbtn { color: #b9b1ff; }
.m-toast { position: absolute; left: 10px; right: 10px; bottom: 62px; z-index: 3; background: #2a2d36; color: #fff; border-radius: 10px; padding: 9px 10px; display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11px; }
.m-toast span:last-child { color: #b9b1ff; font-weight: 700; }
.m-appic { width: 46px; height: 46px; border-radius: 13px; background: linear-gradient(145deg, #7a6bff, #4b39d6); display: grid; place-items: center; font-size: 24px; }
.m-field { display: grid; gap: 3px; font-size: 11px; font-weight: 600; }
.m-field span { display: block; padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--s-line); background: var(--s-card); font-weight: 400; min-height: 26px; }
.m-field span.ph { color: var(--s-mut); }
.m-seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--s-bg); border: 1px solid var(--s-line); border-radius: 10px; padding: 3px; font-size: 12px; font-weight: 700; text-align: center; }
.m-seg span { padding: 5px; border-radius: 7px; }
.m-seg .on { background: var(--s-acc); color: var(--s-acc-fg); }
.m-tiles { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.m-tile { background: var(--s-card); border: 1px solid var(--s-line); border-radius: 10px; padding: 7px; display: grid; }
.m-tile b { font-size: 16px; }
.m-tile small { font-size: 9.5px; color: var(--s-mut); line-height: 1.2; }
.m-list { display: grid; gap: 6px; }
.m-lc { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; background: var(--s-card); border: 1px solid var(--s-line); border-radius: 12px; padding: 7px; }
.m-lc .m-em { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 18px; background: color-mix(in srgb, var(--s-acc) 18%, transparent); }
.m-lc b { display: block; font-size: 12.5px; }
.m-lc small { display: block; font-size: 10.5px; color: var(--s-mut); }
.m-wish { background: var(--s-card); border: 1px solid var(--s-line); border-radius: 12px; overflow: hidden; display: grid; }
.m-wish .m-img { height: 62px; display: grid; place-items: center; font-size: 30px; background: color-mix(in srgb, var(--s-acc) 14%, var(--s-card)); }
.m-wish .m-wb { padding: 7px 8px 9px; display: grid; gap: 5px; }
.m-wish b { font-size: 12.5px; }
.m-wish small { font-size: 10.5px; color: var(--s-mut); }
.m-state { font-size: 11px; font-weight: 700; padding: 4px 7px; border-radius: 8px; background: color-mix(in srgb, var(--s-mut) 18%, transparent); justify-self: start; }
.m-banner { font-size: 10.5px; padding: 7px 8px; border-radius: 10px; background: color-mix(in srgb, var(--s-acc) 16%, var(--s-card)); border: 1px solid var(--s-line); }
.m-gift { display: grid; grid-template-columns: auto 28px 1fr auto; gap: 6px; align-items: center; background: var(--s-card); border: 1px solid var(--s-line); border-radius: 10px; padding: 7px; font-size: 11px; }
.m-gift .m-th { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: color-mix(in srgb, var(--s-acc) 14%, var(--s-card)); font-size: 15px; }
.m-gift b { display: block; font-size: 11.5px; }
.m-gift small { color: var(--s-mut); font-size: 10px; }
.m-check { display: grid; justify-items: center; gap: 1px; font-size: 9px; font-weight: 700; }
.m-check i { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--s-mut); display: block; }
.m-check.on i { background: var(--s-acc); border-color: var(--s-acc); }
.m-tab { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; border-top: 1px solid var(--s-line); background: var(--s-card); padding: 5px 4px 12px; font-size: 9px; text-align: center; color: var(--s-mut); position: relative; }
.m-tab span { display: grid; justify-items: center; gap: 1px; padding: 3px 0; border-radius: 8px; }
.m-tab svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.m-tab .on { color: var(--s-acc); font-weight: 700; }
.m-tab .plus { width: 34px; height: 34px; margin: 0 auto; border-radius: 50%; background: var(--s-acc); color: var(--s-acc-fg); display: grid; place-items: center; }
.m-tab .plus svg { stroke-width: 2.4; }
.m-av { width: 19px; height: 19px; border-radius: 50%; background: #f4a259; display: block; }
.m-home { flex: 1; padding: 22px 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 6px; align-content: start; background: linear-gradient(170deg, #4f6bd8, #8a5bd1 60%, #d4708f); color: #fff; }
.m-home .m-ic { display: grid; justify-items: center; gap: 4px; font-size: 9.5px; text-align: center; text-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
.m-home .m-ic i { font-style: normal; width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-size: 21px; background: rgba(255, 255, 255, .88); }
.m-home .m-ic .wl { background: linear-gradient(145deg, #7a6bff, #4b39d6); }
.m-home .m-dock { grid-column: 1 / -1; margin-top: auto; }
.m-sw { width: 34px; height: 20px; border-radius: 99px; background: var(--s-line); position: relative; flex: none; }
.m-sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.m-sw.on { background: var(--s-acc); }
.m-sw.on::after { left: 16px; }
.m-set { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px; background: var(--s-card); border-radius: 12px; border: 1px solid var(--s-line); font-size: 12.5px; font-weight: 600; }
.m-sbar { flex: none; background: var(--s-card); border-top: 1px solid var(--s-line); padding: 6px 10px 14px; display: grid; gap: 6px; }
.m-sbar .m-url { margin: 0; text-align: center; }
.m-tools { display: flex; justify-content: space-around; align-items: center; color: var(--s-acc); font-size: 18px; }
.m-tools span { display: grid; place-items: center; width: 32px; height: 30px; border-radius: 8px; }
.m-tools svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.m-share { display: grid; gap: 0; background: var(--s-card); border-radius: 12px; border: 1px solid var(--s-line); overflow: visible; }
.m-share span { display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; border-bottom: 1px solid var(--s-line); font-size: 12.5px; }
.m-share span:last-child { border-bottom: 0; }
.m-share svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.m-ios-top { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; font-size: 12px; border-bottom: 1px solid var(--s-line); flex: none; }
.m-ios-top b { font-size: 11px; flex: 1; min-width: 0; text-align: center; line-height: 1.2; }
.m-ios-top .m-tbtn { padding: 4px 5px; font-size: 11.5px; white-space: nowrap; flex: none; }

/* Markierung: wo getippt wird (Ring und Finger) */
.tap { position: relative; z-index: 4; outline: 3px solid var(--hl); outline-offset: 3px; animation: ring 1.6s ease-in-out infinite; }
.tap::after {
  content: "👆"; position: absolute; left: 50%; top: 100%; margin-left: -15px; margin-top: 2px; font-size: 30px; line-height: 1;
  pointer-events: none; animation: bob 1.6s ease-in-out infinite; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .45));
}
.tap.up::after { content: "👇"; top: auto; bottom: 100%; margin-top: 0; margin-bottom: 2px; animation-name: bob-up; }
.tap.left::after { left: auto; right: 100%; top: 50%; margin: -15px 0 0 0; content: "👉"; animation-name: bob-left; }
.m-tab.tap { outline-offset: -4px; }
@keyframes ring { 0%, 100% { box-shadow: 0 0 0 0 var(--hl-soft); } 50% { box-shadow: 0 0 0 9px var(--hl-soft); } }
@keyframes bob { 0%, 100% { transform: translateY(5px); } 50% { transform: translateY(0); } }
@keyframes bob-up { 0%, 100% { transform: translateY(-5px); } 50% { transform: translateY(0); } }
@keyframes bob-left { 0%, 100% { transform: translateX(-5px); } 50% { transform: translateX(0); } }
@media (prefers-reduced-motion: reduce) {
  .tap, .tap::after { animation: none; }
  .tap { box-shadow: 0 0 0 7px var(--hl-soft); }
  .bar i { transition: none; }
}

.done-ic { font-size: 64px; line-height: 1; }

@media (min-width: 820px) {
  h1 { font-size: 2.2rem; }
  .step { grid-template-columns: minmax(0, 1fr) 300px; gap: 48px; align-items: start; }
  .step.nofig { grid-template-columns: minmax(0, 1fr); max-width: 720px; }
  .phone { width: 270px; height: 520px; }
  .choice { grid-template-columns: 1fr 1fr; }
  .nav .wrap { grid-template-columns: 220px 300px; justify-content: end; }
  .nav.solo .wrap { grid-template-columns: 300px; }
}
@media print { .nav, .size-btn { display: none; } body { padding-bottom: 0; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <button type="button" class="brand" id="home" aria-label="Wunschliste-Anleitung: zum Anfang"><span class="brand-ic" aria-hidden="true">🎁</span><span>Wunschliste-Anleitung</span></button>
    <button type="button" class="size-btn" id="bigText" title="Schrift größer oder kleiner stellen">A+ Größer</button>
  </div>
  <div class="wrap prog" id="prog" hidden>

      { t: 'Die Listen von Freunden ansehen',
        b: '<p>Tippen Sie unten auf <span class="q">Übersicht</span>. Unter <b>„Listen deiner Freunde“</b> stehen alle Listen, die Ihre Freunde für Sie freigegeben haben.</p><p>Tippen Sie auf eine Liste, um die Wünsche zu sehen: mit Bild, Preis und Link zum Shop.</p>',
        s: screen(st() + wlNav() + '<div class="m-body"><span class="m-h">Deine Wunschwelt</span><span class="m-h s">Listen deiner Freunde</span>' + friendLists(true) + '</div>' + tabbar('home', '')),
        alt: 'Die Übersicht mit „Listen deiner Freunde“. Die Liste „Weihnachten“ von Erik ist markiert.' },
      { t: 'Einen Wunsch reservieren',
        b: '<p>Haben Sie ein passendes Geschenk gefunden? Tippen Sie beim Wunsch auf <span class="q">🎁 Reservieren</span>.</p>' +
          '<p>Damit ist der Wunsch für Sie vorgemerkt. Alle anderen Schenkenden sehen sofort <b>„🔒 Reserviert von …“</b> und kaufen ihn nicht doppelt.</p>' +
          '<p>Reservieren kostet nichts. Kaufen Sie das Geschenk wie gewohnt im Laden oder im Internet.</p>',
        h: '<p>Aus Versehen getippt? Unten erscheint kurz <b>Rückgängig</b>. Auch später können Sie die Reservierung unter „Besorgen“ wieder freigeben.</p>',
        s: screen(st() + wlNav() + '<div class="m-body"><span class="m-h s">🎄 Weihnachten · Erik</span>' +
          '<div class="m-wish"><span class="m-img">🎧</span><span class="m-wb"><b>Kopfhörer</b><small>Fürs Pendeln · 129 €</small><span class="m-btn sm tap" style="justify-self:start">🎁 Reservieren</span></span></div>' +
          '<div class="m-wish" style="margin-top:22px"><span class="m-img">📚</span><span class="m-wb"><b>Fantasy-Buchreihe</b><small>39 €</small><span class="m-state">🔒 Reserviert von Lena</span></span></div></div>'),
        alt: 'Eine Wunschliste mit zwei Wünschen. Beim Kopfhörer ist der Knopf „Reservieren“ markiert, das Buch ist schon von Lena reserviert.' },
      { t: 'Die Überraschung bleibt geheim',
        b: '<p>Keine Sorge: Wer sich etwas wünscht, sieht auf seiner eigenen Liste <b>nie</b>, was reserviert wurde. Das nennt die Wunschliste <b>Überraschungsschutz</b>.</p>' +
          '<p>Erik sieht also nicht, dass Sie die Kopfhörer reserviert haben. Nur die anderen Schenkenden sehen es, damit nichts doppelt unterm Baum liegt.</p>',
        s: screen(st() + wlNav() + '<div class="m-body"><span class="m-h s">🎄 Weihnachten</span><span class="m-banner tap">🙈 <b>Überraschungsschutz:</b> Was reserviert wurde, siehst du auf deinen eigenen Listen nicht.</span>' +
          '<div class="m-wish" style="margin-top:24px"><span class="m-img">🎧</span><span class="m-wb"><b>Kopfhörer</b><small>Fürs Pendeln · 129 €</small></span></div></div>'),
        alt: 'So sieht Erik seine eigene Liste: oben der Hinweis „Überraschungsschutz“, beim Kopfhörer steht keine Reservierung.',
        cap: 'So sieht Erik seine eigene Liste.' },
      { t: 'Besorgen: Ihre Einkaufsliste',
        b: '<p>Tippen Sie unten auf <span class="q">Besorgen</span>. Hier stehen alle Geschenke, die Sie reserviert haben, mit Preis und dem Knopf <b>Shop ↗</b> zum Online-Shop.</p>' +
          '<p>Haben Sie ein Geschenk gekauft, setzen Sie den Haken bei <span class="q">Gekauft</span>. So behalten Sie den Überblick.</p>',
        s: screen(st() + wlNav() + '<div class="m-body"><span class="m-eye">Deine Einkaufsliste</span><span class="m-h">Meine Geschenke</span>' +
          '<div class="m-tiles"><span class="m-tile"><b>2</b><small>reserviert</small></span><span class="m-tile"><b>1</b><small>schon gekauft</small></span><span class="m-tile"><b>168 €</b><small>Budget</small></span></div>' +
          '<span class="m-p"><b>Erik</b> · 🎄 Weihnachten</span>' +
          '<div class="m-gift"><span class="m-check tap"><i></i>Gekauft</span><span class="m-th">🎧</span><span><b>Kopfhörer</b></span><span>129 €</span></div>' +
          '<div class="m-gift" style="margin-top:26px"><span class="m-check on"><i></i>Gekauft</span><span class="m-th">🧣</span><span><b>Schal</b></span><span>39 €</span></div></div>' + tabbar('geschenke', 'geschenke')),
        alt: 'Seite „Meine Geschenke“. Unten ist „Besorgen“ markiert, beim Kopfhörer der Haken „Gekauft“.' }
    ];
    if (os === 'android') steps.push({ t: 'Benachrichtigungen erlauben',
      b: '<p>Nach dem ersten Anmelden fragt das Handy, ob die Wunschliste Ihnen Benachrichtigungen schicken darf. Tippen Sie auf <span class="q">Zulassen</span>.</p>' +
        '<p>Dann erinnert Sie die App rechtzeitig an Geburtstage und andere Anlässe Ihrer Freunde, an Geschenke, die noch zu besorgen sind, und an Angebote, zum Beispiel am Black Friday.</p>',
      h: '<p>Aus Versehen „Nicht zulassen“ getippt? Öffnen Sie die <b>Einstellungen</b> des Handys › <b>Apps</b> › <b>Wunschliste</b> › <b>Benachrichtigungen</b> und schalten Sie sie ein. Bei älteren Handys sind sie schon erlaubt, dort kommt keine Frage.</p>',
      s: screen(st() + wlNav() + '<div class="m-body"><span class="m-h">Deine Wunschwelt</span></div><div class="m-dim"></div>' +
        '<div class="m-dlg"><div class="m-center"><span style="font-size:24px">🔔</span><b>Wunschliste erlauben, dir Benachrichtigungen zu senden?</b></div><span class="m-btn tap">Zulassen</span><span class="m-btn ghost" style="margin-top:22px">Nicht zulassen</span></div>'),
      alt: 'Frage des Handys „Wunschliste erlauben, dir Benachrichtigungen zu senden?“. Der Knopf „Zulassen“ ist markiert.' });
    else steps.push({ t: 'Was bald ansteht',
      b: '<p>Auf dem iPhone schickt die Wunschliste keine Benachrichtigungen. Schauen Sie deshalb ab und zu in die <b>Übersicht</b>.</p>' +
        '<p>Unter <span class="q">Bald anstehend</span> stehen die nächsten Geburtstage und Anlässe Ihrer Freunde. Neuigkeiten, zum Beispiel Angebote am Black Friday, erscheinen oben als Hinweis.</p>',
      s: screen(st() + wlNav() + '<div class="m-body"><span class="m-eye">Hallo, Oma Inge</span><span class="m-h">Deine Wunschwelt</span>' +
        '<span class="m-banner">🏷️ <b>Black Friday</b><br>2 Wünsche deiner Freunde sind reduziert</span>' +
        '<div class="m-card tap"><b>Bald anstehend</b><span class="m-p">🎂 <b>Lena</b> · Geburtstag · in 5 Tagen</span><span class="m-p">🎄 <b>Weihnachten</b> · in 27 Tagen</span></div></div>' + tabbar('home', '')),
      alt: 'Die Übersicht. Der Kasten „Bald anstehend“ mit Lenas Geburtstag und Weihnachten ist markiert.' });
    steps.push({ t: 'Geschafft!', done: true,
      b: '<p>Jetzt wissen Sie alles Wichtige: Freunde hinzufügen, ihre Listen ansehen, Wünsche reservieren und unter „Besorgen“ abhaken.</p>' +
        '<p>Viel Freude beim Schenken!</p>',
      a: '<a class="btn" href="' + BASE + '">Wunschliste öffnen</a><button type="button" class="btn ghost" data-go="start">Noch einmal von vorn</button>',
      h: '<p>Fragen oder Probleme? Melden Sie sich bei der Person, die Ihnen diese Anleitung geschickt hat, oder schreiben Sie im <a href="' + DISCORD + '">Skeison-Discord</a>.</p>' });
    return steps;
  }

  var PATHS = { android: ANDROID.concat(common('android')), iphone: IPHONE.concat(common('iphone')) };
  var NAMES = { android: 'Android-Handy', iphone: 'iPhone' };

  // ---------- Darstellung ----------
  // Adresse: #start, #android-3, #iphone-5. So funktionieren auch die Zurueck-Taste und das Neuladen.
  function parse() {
    var m = /^#(android|iphone)-(\d+)$/.exec(location.hash);
    if (!m) return null;
    var n = Math.max(1, Math.min(+m[2], PATHS[m[1]].length));
    return { os: m[1], n: n };
  }
  function go(h) { if (location.hash === '#' + h) render(true); else location.hash = h; }

  function detect() {
    var ua = navigator.userAgent || '';
    if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'iphone';
    if (/Android/.test(ua)) return 'android';
    return '';
  }

  function renderStart() {
    var dev = detect();
    prog.hidden = true; nav.hidden = true;
    document.title = 'Wunschliste: Anleitung fürs Handy';
    function pick(os, ic, name, sub) {
      return '<button type="button" class="pick' + (dev === os ? ' mine' : '') + '" data-go="' + os + '-1"><span class="pi" aria-hidden="true">' + ic + '</span>' +
        '<span><b>' + name + '</b><small>' + sub + '</small>' + (dev === os ? '<span class="you">Ihr Gerät</span>' : '') + '</span></button>';
    }
    main.innerHTML = '<article class="step nofig"><div class="txt">' +
      '<h1 tabindex="-1">Die Wunschliste aufs Handy holen</h1>' +
      '<p class="lead">Diese Anleitung zeigt Ihnen Schritt für Schritt, wie Sie die Wunschliste auf Ihr Handy holen und benutzen. Nehmen Sie sich ein paar Minuten Zeit. Sie können jederzeit zurückgehen.</p>' +
      '<p class="hint desk-note" id="deskNote" hidden>Sie lesen am Computer? Öffnen Sie diese Seite am besten auf dem Handy: <span class="url">erschoenfeld2-tech.github.io/Skeison_Web/wunschliste/anleitung.html</span></p>' +
      '<h2>Welches Handy haben Sie?</h2>' +
      '<div class="choice">' + pick('android', '🤖', 'Android-Handy', 'Samsung, Xiaomi, Google Pixel, Motorola, Huawei und fast alle anderen') +
      pick('iphone', '🍎', 'iPhone', 'von Apple, mit dem Apfel auf der Rückseite') + '</div>' +
      '<div class="hint"><p>Nicht sicher? Hat Ihr Handy hinten einen <b>Apfel</b>, ist es ein <b>iPhone</b>. Sonst ist es fast immer ein <b>Android-Handy</b>.</p></div>' +
      '</div></article>';
    var desk = !dev && window.matchMedia && matchMedia('(pointer: fine)').matches;
    document.getElementById('deskNote').hidden = !desk;
  }

  function render(focus) {
    var r = parse();
    if (!r) { renderStart(); finish(focus); return; }
    var steps = PATHS[r.os], s = steps[r.n - 1], total = steps.length;
    prog.hidden = false; nav.hidden = false;
    progText.textContent = 'Schritt ' + r.n + ' von ' + total + ' · ' + NAMES[r.os];
    progBar.style.width = Math.round(r.n / total * 100) + '%';
    document.title = s.t + ' · Wunschliste-Anleitung';
    main.innerHTML = '<article class="step' + (s.s ? '' : ' nofig') + '"><div class="txt">' +
      (s.done ? '<span class="done-ic" aria-hidden="true">🎉</span>' : '') +
      '<h1 tabindex="-1">' + s.t + '</h1>' + s.b +
      (s.a ? '<div class="acts">' + s.a + '</div>' : '') +
      (s.h ? '<div class="hint"><p><b>💡 Tipp</b></p>' + s.h + '</div>' : '') + '</div>' +
      (s.s ? '<figure class="fig" role="img" aria-label="' + s.alt.replace(/"/g, '&quot;') + '">' + s.s + (s.cap ? '<figcaption>' + s.cap + '</figcaption>' : '') + '</figure>' : '') +
      '</article>';
    back.textContent = r.n === 1 ? '← Zur Auswahl' : '← Zurück';
    back.dataset.go = r.n === 1 ? 'start' : r.os + '-' + (r.n - 1);
    next.hidden = !!s.done;
    nav.classList.toggle('solo', !!s.done);
    if (!s.done) next.dataset.go = r.os + '-' + (r.n + 1);
    finish(focus);
  }

  function finish(focus) {
    if (!focus) return;
    window.scrollTo(0, 0);
    var h = main.querySelector('h1');
    if (h) h.focus({ preventScroll: true });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (!b) return;
    e.preventDefault();
    go(b.dataset.go);
  });
  document.getElementById('home').addEventListener('click', function () { go('start'); });
  window.addEventListener('hashchange', function () { render(true); });

  // Pfeiltasten: links zurueck, rechts weiter
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || nav.hidden) return;
    var t = e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if (e.key === 'ArrowRight' && !next.hidden) { e.preventDefault(); next.click(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); back.click(); }
  });

  // Groessere Schrift: auf dem Geraet gemerkt (ohne Speicher einfach nur fuer diesen Besuch)
  var bigBtn = document.getElementById('bigText');
  function setBig(on) {
    document.documentElement.classList.toggle('big', on);
    // Der Knopf nennt, was er tut: groesser bzw. wieder kleiner
    bigBtn.textContent = on ? 'A− Kleiner' : 'A+ Größer';
  }
  try { setBig(localStorage.getItem('wl-anleitung-big') === '1'); } catch (e) { setBig(false); }
  bigBtn.addEventListener('click', function () {
    var on = !document.documentElement.classList.contains('big');
    setBig(on);
    try { localStorage.setItem('wl-anleitung-big', on ? '1' : '0'); } catch (e) { /* ohne Speicher */ }
  });

  render(false);
})();
</script>
