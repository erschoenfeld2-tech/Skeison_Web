name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'   # alle 6 Stunden Steam-Daten aktualisieren
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Letzter erfolgreicher Steam-Stand bleibt zwischen den Laeufen erhalten (Steam blockt Abrufe manchmal)
      - name: Letzten Steam-Stand laden
        uses: actions/cache/restore@v4
        with:
          path: .steam-cache
          key: steam-${{ github.run_id }}
          restore-keys: steam-
      - name: Steam-Daten abrufen
        run: node tools/fetch-steam.js
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      - name: Steam-Stand zwischenspeichern
        if: hashFiles('.steam-cache/steam.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .steam-cache
          key: steam-${{ github.run_id }}
      # Versionsnummern: haengt den Commit an alle lokalen CSS- und JS-Links (z. B. main.css?v=4dbe144).
      # GitHub Pages laesst Browser Dateien 10 Minuten zwischenspeichern; ohne Nummer mischten sie nach einem
      # Update neues HTML mit alten Skripten. Externe Links (http...) bleiben unveraendert.
      - name: Versionsnummern an CSS und JS
        run: |
          v="${GITHUB_SHA::7}"
          find site -name '*.html' -exec sed -i -E "s#(href|src)=\"([A-Za-z0-9_./-]+\.(css|js))\"#\1=\"\2?v=${v}\"#g" {} +
          echo "Version ${v}:"; grep -rhoE '(href|src)="[^"]+\?v=[0-9a-f]+"' site --include='*.html' | sort -u | head -20
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
