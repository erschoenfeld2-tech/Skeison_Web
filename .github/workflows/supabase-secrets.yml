name: Supabase-Secrets
# Uebertraegt die API-Schluessel aus den GitHub-Secrets als Edge-Function-Secrets nach Supabase (fuer gp-sync).
# So liegen die Schluessel nur an einer Stelle: Wer sie bei GitHub aendert, startet danach diesen Workflow
# (Actions -> Supabase-Secrets -> Run workflow). Er laeuft ausserdem automatisch, wenn sich gp-sync oder diese Datei aendert.
# Einmalig noetig: GitHub-Secret SUPABASE_ACCESS_TOKEN (Supabase -> Account -> Access Tokens).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/supabase-secrets.yml
      - supabase/functions/gp-sync/**
permissions:
  contents: read
concurrency:
  group: supabase-secrets
jobs:
  push-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets an Supabase uebergeben
        env:
          PROJECT_REF: pumdupjmmvimlxqvuymg
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub-Secret SUPABASE_ACCESS_TOKEN fehlt (Supabase -> Account -> Access Tokens anlegen und bei GitHub eintragen)."
            exit 1
          fi
          # Nur gesetzte Schluessel uebertragen; die Werte erscheinen nie im Log (jq baut das JSON)
          body=$(jq -n --arg h "$HENRIK_API_KEY" --arg s "$STEAM_API_KEY" \
            '[{name: "HENRIK_API_KEY", value: $h}, {name: "STEAM_API_KEY", value: $s}] | map(select(.value != ""))')
          names=$(echo "$body" | jq -r 'map(.name) | join(", ")')
          if [ "$(echo "$body" | jq length)" = "0" ]; then
            echo "::warning::Weder HENRIK_API_KEY noch STEAM_API_KEY ist bei GitHub hinterlegt, nichts zu tun."
            exit 0
          fi
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data-binary @- <<< "$body")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Supabase hat mit HTTP $code geantwortet: $(head -c 300 resp.txt)"
            exit 1
          fi
          echo "Uebertragen: $names"
          echo "### Supabase-Secrets gesetzt: $names" >> "$GITHUB_STEP_SUMMARY"
