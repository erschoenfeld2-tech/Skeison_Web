name: PR-Labels
# Setzt an jedem Pull Request die Bereich-Labels nach den geaenderten Ordnern (Zuordnung: .github/labeler.yml).
# pull_request_target: liest die Zuordnung von main und darf Labels setzen; es wird kein Code aus dem PR ausgefuehrt.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true   # Label wieder entfernen, wenn der PR den Bereich nicht mehr beruehrt
